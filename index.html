<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>アバター一覧</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
      background: #f7f7f7;
      color: #333;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 16px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid #ddd;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 22px;
    }

    #search {
      width: 100%;
      max-width: 650px;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    #count {
      margin-top: 10px;
      font-size: 14px;
      color: #666;
    }

    main {
      padding: 16px;
    }

    #avatar-list {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }

    .avatar-card {
      overflow: hidden;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }

    .avatar-image-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1 / 1;
      background: #fafafa;
    }

    .avatar-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .avatar-info {
      padding: 10px;
    }

    .avatar-name {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.5;
      word-break: break-word;
    }

    .avatar-category {
      margin-top: 6px;
      font-size: 12px;
      color: #777;
    }

    .message {
      grid-column: 1 / -1;
      padding: 40px 16px;
      text-align: center;
      color: #666;
    }

    @media (max-width: 600px) {
      header {
        padding: 12px;
      }

      main {
        padding: 10px;
      }

      #avatar-list {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>アバター一覧</h1>

    <input
      id="search"
      type="search"
      placeholder="アバター名を検索"
      autocomplete="off"
    >

    <div id="count">読み込み中...</div>
  </header>

  <main>
    <div id="avatar-list"></div>
  </main>

  <script>
    const searchInput =
      document.getElementById("search");

    const avatarList =
      document.getElementById("avatar-list");

    const countElement =
      document.getElementById("count");

    let avatars = [];

    function normalizeText(value) {
      return String(value || "")
        .normalize("NFKC")
        .toLowerCase()
        .replace(/\s+/g, "");
    }

    function createAvatarCard(avatar) {
      const card = document.createElement("article");
      card.className = "avatar-card";

      const imageWrap = document.createElement("div");
      imageWrap.className = "avatar-image-wrap";

      const image = document.createElement("img");
      image.src = avatar.image || "";
      image.alt = avatar.name || "アバター画像";
      image.loading = "lazy";

      image.addEventListener("error", () => {
        imageWrap.textContent = "画像なし";
        imageWrap.style.color = "#999";
        imageWrap.style.fontSize = "12px";
      });

      imageWrap.appendChild(image);

      const info = document.createElement("div");
      info.className = "avatar-info";

      const name = document.createElement("p");
      name.className = "avatar-name";
      name.textContent = avatar.name || "名前なし";

      const category = document.createElement("div");
      category.className = "avatar-category";

      const categoryParts = [
        avatar.category,
        avatar.subcategory
      ].filter(Boolean);

      category.textContent =
        categoryParts.join(" ＞ ");

      info.appendChild(name);

      if (categoryParts.length > 0) {
        info.appendChild(category);
      }

      card.appendChild(imageWrap);
      card.appendChild(info);

      return card;
    }

    function renderAvatars(items) {
      avatarList.innerHTML = "";

      countElement.textContent =
        `${items.length}件表示 / 全${avatars.length}件`;

      if (items.length === 0) {
        const message = document.createElement("div");
        message.className = "message";
        message.textContent =
          "該当するアバターはありません。";

        avatarList.appendChild(message);
        return;
      }

      const fragment =
        document.createDocumentFragment();

      for (const avatar of items) {
        fragment.appendChild(
          createAvatarCard(avatar)
        );
      }

      avatarList.appendChild(fragment);
    }

    function filterAvatars() {
      const keyword =
        normalizeText(searchInput.value);

      if (!keyword) {
        renderAvatars(avatars);
        return;
      }

      const filtered = avatars.filter(avatar => {
        const searchableText = normalizeText([
          avatar.name,
          avatar.category,
          avatar.subcategory,
          avatar.id
        ].join(" "));

        return searchableText.includes(keyword);
      });

      renderAvatars(filtered);
    }

    async function loadAvatars() {
      try {
        const response = await fetch(
          "./avatars.json",
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error(
            `読み込み失敗：${response.status}`
          );
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
          throw new Error(
            "avatars.jsonが配列形式ではありません。"
          );
        }

        avatars = data.filter(avatar =>
          avatar &&
          typeof avatar === "object" &&
          avatar.name &&
          avatar.image
        );

        renderAvatars(avatars);

      } catch (error) {
        console.error(error);

        countElement.textContent =
          "読み込み失敗";

        const message = document.createElement("div");
        message.className = "message";

        message.innerHTML = `
          avatars.jsonを読み込めませんでした。<br>
          少し待ってから再読み込みしてください。
        `;

        avatarList.innerHTML = "";
        avatarList.appendChild(message);
      }
    }

    searchInput.addEventListener(
      "input",
      filterAvatars
    );

    loadAvatars();
  </script>
</body>
</html>
