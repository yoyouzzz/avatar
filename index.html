<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Avatar Collection</title>

<style>
body{
    font-family:sans-serif;
    background:#f5f5f5;
    margin:30px;
}

h1{
    text-align:center;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:10px;
    padding:10px;
    text-align:center;
}

.card img{
    width:100%;
    border-radius:8px;
}
</style>

</head>

<body>

<h1>My Avatar Collection</h1>

<div class="grid">

<p>ここにアバター一覧が表示されます</p>

</div>

</body>
</html>
